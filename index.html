<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>

  <main class="app">
    <header class="top">
      <div id="greeting" class="greeting">Hello, Michelle</div>
      <div class="glass themes" role="group" aria-label="Theme">
        <button data-theme="light">Light</button>
        <button data-theme="dark">Dark</button>
        <button data-theme="system">System</button>
      </div>
    </header>

    <form id="search" class="glass search" autocomplete="off">
      <input id="query" type="text" placeholder="Search city…" aria-label="Search city">
      <button type="submit" aria-label="Search">⌕</button>
    </form>

    <section class="glass hero">
      <h1 id="city">—</h1>
      <div id="temp" class="temp">--°</div>
      <div id="desc" class="desc">Loading…</div>
      <div id="hilo" class="hilo"></div>
    </section>

    <section class="glass">
      <h2>Hourly</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="glass">
      <h2>7-Day Forecast</h2>
      <div id="daily" class="daily"></div>
    </section>

    <section class="grid">
      <div class="glass tile"><h2>Feels Like</h2><p id="feels">--</p></div>
      <div class="glass tile"><h2>Humidity</h2><p id="humidity">--</p></div>
      <div class="glass tile"><h2>Wind</h2><p id="wind">--</p></div>
      <div class="glass tile"><h2>UV Index</h2><p id="uv">--</p></div>
    </section>

    <p class="credit">Data: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
